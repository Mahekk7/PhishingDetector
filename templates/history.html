<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detection History - Cyber Safety Analyzer</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fc;
            color: #172033;
            min-height: 100vh;
            line-height: 1.6;
        }


        /* ================= HEADER ================= */

        header {
            background: #0b1f3a;
            color: white;
            padding: 22px 0;
            box-shadow: 0 4px 18px rgba(11, 31, 58, 0.12);
        }

        .wrap {
            width: 92%;
            max-width: 1200px;
            margin: auto;
        }

        .nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .brand svg {
            width: 25px;
            height: 25px;
        }

        .links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
        }

        .links a {
            color: #dbe7f5;
            text-decoration: none;
            padding: 8px 11px;
            border-radius: 7px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s ease;
        }

        .links a:hover {
            background: #17365f;
            color: white;
        }

        .links svg {
            width: 16px;
            height: 16px;
        }


        /* ================= MAIN ================= */

        main {
            padding: 50px 0 70px;
        }


        /* ================= PAGE INTRO ================= */

        .page-intro {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 35px;
        }

        .intro-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #e7f0ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intro-icon svg {
            width: 33px;
            height: 33px;
            stroke-width: 1.8;
        }

        .intro-label {
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .intro-label svg {
            width: 15px;
            height: 15px;
        }

        .page-intro h1 {
            color: #0b1f3a;
            font-size: 34px;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .intro-text {
            color: #64748b;
            font-size: 15px;
        }


        /* ================= MAIN CARD ================= */

        .card {
            background: white;
            border: 1px solid #e1e8f0;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 7px 24px rgba(11, 31, 58, 0.05);
        }


        /* ================= HISTORY HEADER ================= */

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .history-heading {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .heading-icon {
            width: 27px;
            height: 27px;
            color: #2563eb;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .card h2 {
            margin: 0;
            color: #0b1f3a;
            font-size: 24px;
        }

        .history-header p {
            margin: 5px 0 0;
            color: #64748b;
            font-size: 14px;
        }


        /* ================= CLEAR BUTTON ================= */

        .clear-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #fecaca;
            background: white;
            color: #b91c1c;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
            white-space: nowrap;
        }

        .clear-btn svg {
            width: 16px;
            height: 16px;
        }

        .clear-btn:hover {
            background: #fef2f2;
            border-color: #fca5a5;
        }


        /* ================= TABLE ================= */

        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e1e8f0;
            border-radius: 9px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #0b1f3a;
            color: white;
            padding: 14px 15px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            font-size: 14px;
            vertical-align: middle;
        }

        tr {
            background: white;
            transition: 0.15s ease;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        tr:hover {
            background: #f1f5f9;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }


        /* ================= INPUT ================= */

        .input-value {
            max-width: 330px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            color: #1e293b;
            font-weight: 500;
        }


        /* ================= DETECTION TYPE ================= */

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge svg {
            width: 14px;
            height: 14px;
        }

        .badge-url {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .badge-qr {
            background: #f8fafc;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .badge-message {
            background: #f0f9ff;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }


        /* ================= STATUS ================= */

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .status svg
